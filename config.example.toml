# apid forwarding config example.
# Copy to config.toml (or pass --config <path>) and edit.
# Ops params (listen addr / SQLite / TRACE) stay in env vars; see CLAUDE.md.
#
# Two tables:
#   [[upstream]] — a backend, defined once and referenced by name.
#   [[route]]    — a public entrypoint (path + client protocol) that dispatches
#                  by the request's model to one upstream.
#
# Conversion happens when a route's input_protocol differs from the matched
# upstream's protocol (currently only openai_responses -> openai_chat_completions).
# Equal protocols = forward without conversion. Chat streams force
# stream_options.include_usage=true so metrics receive exact token usage.
# An upstream with protocol = "openai_chat_completions" and
# supports_responses = true also serves OpenAI Responses natively: responses
# routes hitting it forward raw bytes to its responses endpoint instead of
# converting — no duplicate upstream needed for the same provider.
# Protocols: openai_responses, openai_chat_completions, anthropic_messages.
#
# Optional inbound client auth for apid itself. Empty/omitted = disabled.
# When set, clients must present this key as Authorization: Bearer <key>,
# X-Api-Key: <key>, or Api-Key: <key>. This key is never forwarded upstream.
# Codex subscription routes are the exception: they accept the local key only
# as X-Apid-Key because Authorization carries the client's OpenAI credential.
# Only forwarding routes require it; /healthz, /api/hello, and /stats(/*) stay open.
# client_api_key = "apid-local-static-key"

# Optional key for the read-only dashboard and its JSON API (GET /stats,
# /stats/*). Empty/omitted = stats stay open. When set, requests must present
# the key as Authorization: Bearer <key>, X-Api-Key: <key>, or Api-Key: <key>.
# Independent of client_api_key: Grafana can send this same header, while
# forwarding routes keep using client_api_key.
# stats_api_key = "apid-stats-view-key"

# ── Upstreams: write each backend once, reuse from any entrypoint. ──
[[upstream]]
name = "deepseek"
protocol = "openai_chat_completions"
base_url = "https://api.deepseek.com/v1"
path = "/chat/completions"
api_key = "sk-xxx"        # empty = pass through the client's Authorization
model = "deepseek-chat"   # empty = pass through the client's model

[[upstream]]
name = "openai"
protocol = "openai_chat_completions"
base_url = "https://api.openai.com"
path = "/v1/chat/completions"
supports_responses = true   # same backend also speaks Responses natively
# responses_path = "/v1/responses"  # optional; empty = derived from path
#                                  # (strip "/chat/completions", append "/responses")

[[upstream]]
name = "anthropic"
protocol = "anthropic_messages"
base_url = "https://api.anthropic.com"
path = "/v1/messages"
api_key = "sk-ant-xxx"   # sent as X-Api-Key for anthropic_messages

# ── Experimental Codex subscription proxy (optional) ────────────────────────
# This mode passes the Codex client's OpenAI Bearer credential only to the
# code-fixed ChatGPT Codex backend. It requires APID_LISTEN to be an IP-literal
# loopback address, for example APID_LISTEN=127.0.0.1:19092.
#
# [[upstream]]
# name = "openai-codex-subscription"
# protocol = "openai_responses"
# base_url = "https://chatgpt.com/backend-api/codex"
# path = "/responses"
# auth_mode = "codex_subscription"
#
# [[route]]
# path = "/codex/v1/responses"
# input_protocol = "openai_responses"
#   [[route.model]]
#   match = "*"
#   upstream = "openai-codex-subscription"
#   model = ""
#
# [[route]]
# path = "/codex/v1/responses/compact"
# input_protocol = "openai_responses"
# operation = "responses_compact"
#   [[route.model]]
#   match = "*"
#   upstream = "openai-codex-subscription"
#   model = ""

# ── Responses entrypoint: clients speak Responses API, dispatched by model. ──
[[route]]
path = "/v1/responses"
input_protocol = "openai_responses"

  [[route.model]]
  match = "deepseek-*"     # exact name or glob
  upstream = "deepseek"    # convert (responses -> chat) since protocols differ
  # model omitted => inherit upstream.model ("deepseek-chat")

  [[route.model]]
  match = "gpt-4o"         # rewrite this incoming model for the same upstream
  upstream = "deepseek"
  model = "deepseek-reasoner"  # per-rule override beats upstream.model

  [[route.model]]
  match = "*"              # empty or "*" = catch-all (at most one)
  upstream = "openai"      # supports_responses = true => native responses -> responses
                           # passthrough (no conversion), forwarded to /v1/responses
  model = ""               # "" = force pass-through the client's model
                           # (omit the key instead to inherit upstream.model)

# ── Chat entrypoint: same upstreams reused, no duplication of backend info. ──
[[route]]
path = "/v1/chat/completions"
input_protocol = "openai_chat_completions"

  [[route.model]]
  upstream = "openai"      # equal protocols => pure forward

# ── Anthropic Messages entrypoint: pure forward only, no protocol conversion. ──
[[route]]
path = "/v1/messages"
input_protocol = "anthropic_messages"

  [[route.model]]
  match = "claude-*"
  upstream = "anthropic"   # equal protocols => pure forward

# ── Standalone web search (optional) ──────────────────────────────────────────
# When [search] is configured, apid serves POST /v1/alpha/search, the endpoint
# Codex calls when a custom provider opts into supports_standalone_web_search.
# This lets Codex's built-in web.run tool work with non-OpenAI backends.
#
# Enable on the Codex side by adding to ~/.codex/config.toml:
#   [model_providers.apid]
#   supports_standalone_web_search = true
#
# [search]
# provider = "exa"                          # only "exa" supported
# api_key = "your-exa-api-key"              # Exa API key (https://exa.ai)
# # base_url = "https://api.exa.ai"         # optional; defaults to this
# # path = "/v1/alpha/search"              # optional; defaults to this

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>apid · stats</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;text y='14' font-size='14'&gt;📊&lt;/text&gt;&lt;/svg&gt;" />
</head>
<body class="loading intro">
  <div class="topbars">
  <header class="topbar">
    <div class="brand">
      <span class="logo">apid</span>
      <span class="sub" id="viewLabel">stats</span>
    </div>
    <div class="seg views" id="viewTabs">
      <button data-view="stats" class="active">stats</button>
      <button data-view="routes">routes</button>
    </div>
    <div class="ranges" id="rangePresets">
      <button data-range="1h">1h</button>
      <button data-range="6h">6h</button>
      <button data-range="24h" class="active">24h</button>
      <button data-range="today">Today</button>
      <button data-range="7d">7d</button>
      <button data-range="30d">30d</button>
      <button data-range="all">All</button>
    </div>
    <div class="custom-range">
      <input type="datetime-local" id="fromInput" title="From" />
      <span class="dash">→</span>
      <input type="datetime-local" id="toInput" title="To" />
    </div>
    <div class="spacer"></div>
    <label class="auto" title="Auto refresh every 30s">
      <input type="checkbox" id="autoRefresh" /> auto
    </label>
    <button id="refreshBtn" class="refresh" title="Refresh">⟳</button>
  </header>

  <section class="filters">
    <div class="filter" id="modelFilter"></div>
    <div class="filter" id="protocolFilter"></div>
    <div class="seg" id="bucketSeg" title="Time-series granularity">
      <button data-bucket="auto" class="active">auto</button>
      <button data-bucket="15min">15m</button>
      <button data-bucket="hour">1h</button>
      <button data-bucket="day">1d</button>
    </div>
    <div class="spacer"></div>
    <div class="status-kpis" id="kpiCondensed"></div>
    <span class="status" id="statusLine"></span>
  </section>
  </div>

  <main>
    <div id="statsView">
    <section class="kpis" id="kpis"></section>

    <section class="charts">
      <div class="card chart-card">
        <div class="card-head"><h3>Requests over time</h3><span class="hint" id="reqHint"></span></div>
        <div class="canvas-wrap"><div class="skel skel-fill"></div><canvas id="chartRequests"></canvas></div>
      </div>
      <div class="card chart-card">
        <div class="card-head"><h3>Tokens over time</h3><span class="hint">cached · uncached · output · hit-rate %</span></div>
        <div class="canvas-wrap"><div class="skel skel-fill"></div><canvas id="chartTokens"></canvas></div>
      </div>
      <div class="card chart-card">
        <div class="card-head"><h3>Latency over time</h3><span class="hint">avg duration · avg TTFT (ms)</span></div>
        <div class="canvas-wrap"><div class="skel skel-fill"></div><canvas id="chartLatency"></canvas></div>
      </div>
      <div class="card chart-card">
        <div class="card-head"><h3>Throughput over time</h3><span class="hint">tokens / sec</span></div>
        <div class="canvas-wrap"><div class="skel skel-fill"></div><canvas id="chartThroughput"></canvas></div>
      </div>
      <div class="card chart-card span2-doughnut">
        <div class="card-head"><h3>Token share by model</h3><span class="hint">total tokens</span></div>
        <div class="canvas-wrap doughnut"><div class="skel skel-fill"></div><canvas id="chartShare"></canvas></div>
      </div>
    </section>

    <section class="card table-card">
      <div class="card-head"><h3>By model</h3><span class="hint" id="byModelHint"></span></div>
      <div class="table-scroll">
        <table id="byModelTable" class="data-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card table-card">
      <div class="card-head">
        <h3>Requests</h3>
        <div class="head-controls">
          <label class="auto"><input type="checkbox" id="errorsOnly" /> errors only</label>
          <select id="limitSelect" title="Rows">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="250">250</option>
            <option value="500">500</option>
          </select>
        </div>
      </div>
      <div class="table-scroll">
        <table id="requestsTable" class="data-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    </div>

    <!-- Routes view: the loaded config drawn as entrypoint -> model rule -> upstream. -->
    <div id="routesView" hidden>
      <section class="topo-bar" id="topoMeta"></section>
      <section class="topo-graph" id="topoGraph">
        <div class="topo-col" id="topoRoutes"></div>
        <svg class="topo-links" id="topoLinks" aria-hidden="true"></svg>
        <div class="topo-col" id="topoUpstreams"></div>
      </section>
      <section class="topo-legend" id="topoLegend"></section>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <div id="reqModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-label="Request detail">
      <div class="modal-head">
        <h3>Request detail</h3>
        <button class="modal-close" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="reqModalBody"></div>
    </div>
  </div>

  <script src="lib/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
